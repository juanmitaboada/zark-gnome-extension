# SonarQube Cloud: read by the scan in CI (.github/workflows/ci.yml, job
# analysis). Not in the zip (dev/check-pack.py) nor in the .deb.
sonar.organization=juanmitaboada
sonar.projectKey=juanmitaboada_zark-gnome-extension

# The whole tree is source except tests/, which is test code, and build/,
# where make coverage writes the lcov.
sonar.sources=.
sonar.exclusions=tests/**,build/**
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# make coverage's lcov (gjs's own coverage of lib/, the test job). Modules
# that need GNOME Shell (indicator, details, notifier, ...) are not loaded
# by the tests, so the lcov has no lines of theirs.
sonar.javascript.lcov.reportPaths=build/coverage/coverage.lcov

# dev/'s Python scripts run on Ubuntu 26.04's Python, 3.14.
sonar.python.version=3.14

# The stylesheets are GNOME Shell St CSS: spacing and icon-size are St
# properties, which the web CSS rule S4654 does not know.
sonar.issue.ignore.multicriteria=st
sonar.issue.ignore.multicriteria.st.ruleKey=css:S4654
sonar.issue.ignore.multicriteria.st.resourceKey=stylesheet*.css

# The scan does not wait for the quality gate, so a red gate fails no CI
# run. true makes the analysis job wait for the gate and fail when it is red.
sonar.qualitygate.wait=false
